name: BBS Auto Sign-In

on:
  schedule:
    # 每天多次执行（北京时间 16:00 / 18:00 / 20:00 / 22:00）
    # 脚本对"今日已签"同样返回成功，多次触发无副作用，提高成功率
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Run sign script
        env:
          BBS_COOKIE: ${{ secrets.BBS_COOKIE }}
        run: node sign.js