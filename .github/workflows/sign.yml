name: BBS Auto Sign-In

on:
  schedule:
    # 每天 08:00 UTC = 北京时间 16:00 执行签到
    - cron: '0 8 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Run sign script
        env:
          BBS_COOKIE: ${{ secrets.BBS_COOKIE }}
        run: node sign.js